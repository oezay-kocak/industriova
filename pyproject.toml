[project]
name = "industriova"
version = "0.3.0.dev1"
description = "Industriova industrial idle and factory management game."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
]

[project.scripts]
pz-economy-stress = "production_zero.tools.economy_stress_test:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
production_zero = ["assets/freight/*.svg", "assets/freight/*.png", "assets/machines/*.png", "assets/resources/*.png", "assets/ui/*.png", "data/*.json"]
